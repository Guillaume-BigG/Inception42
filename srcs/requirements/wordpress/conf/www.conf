[www]
user = www-data
group = www-data
listen = 9000
listen.owner = www-data
listen.group = www-data
pm = dynamic
pm.start_servers = 2
pm.max_children = 10
pm.min_spare_servers = 1
pm.max_spare_servers = 5
pm.max_requests = 500  # Recycle processes after 500 requests (prevents memory leaks)

# This file is a configuration for a PHP-FPM (FastCGI Process Manager) pool.
# Below is the explanation for each line:

# The user and group under which the PHP-FPM processes will run.
user = www-data  # The user running the PHP-FPM processes is 'www-data', which is a common user for web server processes.
group = www-data  # The group associated with the PHP-FPM processes is also 'www-data', ensuring consistent permissions.

# The port on which the PHP-FPM service listens for requests.
listen = 9000  # PHP-FPM listens on port 9000 for incoming FastCGI requests from the web server.

# Specifies the ownership of the socket file or TCP/IP socket.
listen.owner = www-data  # The user 'www-data' will have ownership of the socket file or network socket.
listen.group = www-data  # The group 'www-data' will have ownership of the socket file or network socket.

# Process manager settings (PM).
pm = dynamic  # Dynamic process management means that the number of child processes can vary depending on load.

# The number of child processes to start initially.
pm.start_servers = 2  # Two child processes are started when PHP-FPM starts. This is the initial number.

# Maximum number of child processes that PHP-FPM will spawn.
pm.max_children = 10  # PHP-FPM will spawn up to 10 child processes to handle requests. If more processes are needed, it will scale.

# Minimum number of idle (spare) child processes.
pm.min_spare_servers = 1  # At least 1 child process should be idle and ready to handle incoming requests.

# Maximum number of idle (spare) child processes.
pm.max_spare_servers = 5  # No more than 5 idle child processes should be running to prevent resource wastage.

# Maximum number of requests a child process will handle before being recycled.
pm.max_requests = 500  # After processing 500 requests, a child process will be recycled to prevent memory leaks.
